<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />   <stop offset="50%" stop-color="#9B72CB" />  <stop offset="100%" stop-color="#D96570" /> </linearGradient>
    
    <linearGradient id="cloudGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <path d="M 135 380 a 70 70 0 0 1 -20 -135 a 90 90 0 0 1 170 -40 a 80 80 0 0 1 130 30 a 70 70 0 0 1 -10 130 H 135 Z"
        fill="url(#cloudGradient)"
        stroke="rgba(255,255,255,0.05)"
        stroke-width="3"/>

  <path d="M 360,140 Q 360,180 320,180 Q 360,180 360,220 Q 360,180 400,180 Q 360,180 360,140 Z" 
        fill="url(#aiGradient)" 
        filter="url(#glow)"/>
  <path d="M 140,200 Q 140,220 120,220 Q 140,220 140,240 Q 140,220 160,220 Q 140,220 140,200 Z" 
        fill="url(#aiGradient)" 
        opacity="0.8"/>

  <text x="256" y="340" 
        font-family="'Segoe UI Symbol', 'Apple Symbols', sans-serif" 
        font-size="180" 
        font-weight="normal" 
        fill="url(#aiGradient)" 
        text-anchor="middle" 
        filter="url(#glow)">♍</text>
</svg>
